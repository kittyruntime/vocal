name: Release desktop clients

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C web build
      - run: pnpm -C desktop build
      - run: pnpm -C desktop run prepare-web
      - run: pnpm -C desktop exec electron-builder --win --x64 --publish never
        env:
          # No code-signing certificate yet (see desktop/README.md) --
          # produces an unsigned installer; users will see an "unknown
          # publisher" warning until one is added. --publish never still
          # writes the auto-update feed metadata (latest.yml) locally
          # without electron-builder trying to talk to GitHub itself --
          # the softprops/action-gh-release step below handles the upload.
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            desktop/release/*.exe
            desktop/release/*.exe.blockmap
            desktop/release/latest.yml
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C web build
      - run: pnpm -C desktop build
      - run: pnpm -C desktop run prepare-web
      - run: pnpm -C desktop exec electron-builder --linux --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: linux-installers
          path: |
            desktop/release/*.AppImage
            desktop/release/*.deb
            desktop/release/*.AppImage.blockmap
            desktop/release/latest-linux.yml
          if-no-files-found: error

  build-mac:
    runs-on: macos-latest
    # Best-effort: no Apple Developer certificate to sign/notarize with, and
    # nobody on the team can verify a macOS build by hand. A failure here
    # (or Apple tightening Gatekeeper requirements) must never block the
    # Windows/Linux release.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C web build
      - run: pnpm -C desktop build
      - run: pnpm -C desktop run prepare-web
      - run: pnpm -C desktop exec electron-builder --mac --x64 --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.zip.blockmap
            desktop/release/latest-mac.yml
          if-no-files-found: error

  publish:
    needs: [build-windows, build-linux, build-mac]
    if: always() && (needs.build-windows.result == 'success' || needs.build-linux.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - run: node scripts/changelog-section.mjs "${GITHUB_REF_NAME#v}" > release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          name: "Vocal ${{ github.ref_name }}"
          body_path: release-notes.md
          files: artifacts/**/*
          fail_on_unmatched_files: true
