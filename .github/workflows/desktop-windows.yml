name: Build Windows desktop client

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "web/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/desktop-windows.yml"

jobs:
  build:
    # electron-builder's Windows target needs to run on Windows unless Wine
    # is set up for cross-compiling from Linux -- a native runner sidesteps
    # that entirely.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm -C web build

      - run: pnpm -C desktop build

      - run: pnpm -C desktop run prepare-web

      - run: pnpm -C desktop exec electron-builder --win --x64 --publish never
        env:
          # No code-signing certificate yet (see desktop/README.md) --
          # produces an unsigned installer; users will see an "unknown
          # publisher" warning until one is added.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: vocal-windows-installer
          path: desktop/release/*.exe
          if-no-files-found: error
