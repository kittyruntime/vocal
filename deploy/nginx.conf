server {
  listen 80;
  server_name _;

  # Docker replaces a container's IP on every Coolify deployment. Resolve the
  # service name at request time so this long-lived nginx container never keeps
  # sending traffic to an old server address. Docker's embedded DNS is IPv4
  # here; disabling AAAA also avoids retries against unreachable overlay IPv6.
  resolver 127.0.0.11 valid=2s ipv6=off;
  resolver_timeout 2s;
  set $server_backend server:3000;

  location /api/ {
    proxy_pass http://$server_backend$request_uri;
    proxy_http_version 1.1;
    proxy_connect_timeout 1s;
    proxy_read_timeout 30s;
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_timeout 3s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }

  location /ws {
    proxy_pass http://$server_backend$request_uri;
    proxy_http_version 1.1;
    proxy_connect_timeout 1s;
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_timeout 3s;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_read_timeout 75s;
  }

  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
  }
}
