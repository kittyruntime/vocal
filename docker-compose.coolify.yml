services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vocal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Coolify}
      POSTGRES_DB: vocal
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vocal -d vocal"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: .
      dockerfile: deploy/server.Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://vocal:${POSTGRES_PASSWORD}@postgres:5432/vocal
      MESSAGE_MASTER_KEY: ${MESSAGE_MASTER_KEY:?Set MESSAGE_MASTER_KEY in Coolify}
      COOKIE_SECURE: "true"
      APP_ORIGIN: ${APP_ORIGIN:?Set APP_ORIGIN to the public app URL}
      LIVEKIT_URL: ${LIVEKIT_URL:?Set LIVEKIT_URL to the public wss LiveKit URL}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?Set LIVEKIT_API_KEY in Coolify}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?Set LIVEKIT_API_SECRET in Coolify}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3000"

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    depends_on:
      - server
    expose:
      - "80"

  livekit:
    image: livekit/livekit-server:latest
    restart: unless-stopped
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        bind_addresses:
          - "0.0.0.0"
        rtc:
          tcp_port: 7881
          udp_port: 7882
          use_external_ip: true
        keys:
          ${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}
        webhook:
          api_key: ${LIVEKIT_API_KEY}
          urls:
            - http://server:3000/api/voice/webhook
    expose:
      - "7880"
    ports:
      - "7881:7881/tcp"
      - "7882:7882/udp"

volumes:
  postgres-data:
